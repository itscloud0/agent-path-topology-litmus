name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Compile package
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Validate disposable topology fixtures
        run: PYTHONPATH=src python -m agent_path_topology_litmus validate --output "$RUNNER_TEMP/agent-path-topology-litmus" --format json

  public-install:
    name: Public tag install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install immutable public release
        run: python -m pip install "git+https://github.com/itscloud0/agent-path-topology-litmus.git@a0b4669"
      - name: Validate public release fixtures
        run: agent-path-topology-litmus validate --output "$RUNNER_TEMP/agent-path-topology-litmus" --format json
