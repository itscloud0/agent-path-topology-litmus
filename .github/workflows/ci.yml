name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: PYTHONPATH=src python -m unittest discover -s tests
      - name: Compile package
        run: PYTHONPATH=src python -m compileall -q src tests
      - name: Validate disposable topology fixtures
        run: PYTHONPATH=src python -m agent_path_topology_litmus validate --output "$RUNNER_TEMP/agent-path-topology-litmus" --format json
