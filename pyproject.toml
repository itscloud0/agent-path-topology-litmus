[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-path-topology-litmus"
version = "0.1.0"
description = "Topology fixtures for checking how coding agents handle symlinks, submodules, worktrees, and path-scoped config."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Ilia Sorokin" }]
keywords = [
  "coding-agent",
  "agent-testing",
  "symlink",
  "git-submodule",
  "git-worktree",
  "developer-tools",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
agent-path-topology-litmus = "agent_path_topology_litmus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_path_topology_litmus"]

